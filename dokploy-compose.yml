services:
  app:
    # Sem build: o Dokploy reusa a imagem ja existente com essa tag e nenhum
    # commit novo chega a producao. VITE_* precisa ser build arg porque o Vite
    # inlina essas variaveis no bundle - em runtime nao tem efeito.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_AUTHENTIK_ENABLED: ${VITE_AUTHENTIK_ENABLED:-false}
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: loja-auster-app:latest
    container_name: lojauster-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3001
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      FEEDZ_API_KEY: ${FEEDZ_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      AUTHENTIK_ISSUER_URL: ${AUTHENTIK_ISSUER_URL}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      # MinIO: S3_ENDPOINT e o nome do container na rede, nao o host publico.
      # O download passa pela aplicacao, o bucket nao e publico.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PORT: ${S3_PORT}
      S3_USE_SSL: ${S3_USE_SSL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    dns:
      - 10.10.30.242
    networks:
      - shared-postgres
      - dokploy-network

networks:
  shared-postgres:
    external: true
  dokploy-network:
    external: true
